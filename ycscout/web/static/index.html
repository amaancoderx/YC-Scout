<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YC Scout</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111827'/%3E%3Cpath d='M10 9l6 8 6-8M16 17v7' stroke='%23fb923c' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>try{var t=localStorage.getItem('ycscout-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=1.2.1">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/overview">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7"/><path d="M10 9l6 8 6-8M16 17v7"/></svg>
        </span>
        <span class="brand-name">YC Scout</span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/overview" data-route="overview"><i data-icon="grid"></i>Overview</a>
        <a href="#/companies" data-route="companies"><i data-icon="building"></i>Companies</a>
        <a href="#/outreach" data-route="outreach"><i data-icon="mail"></i>Outreach<span class="nav-badge" id="badge-outreach" hidden></span></a>
        <a href="#/pipeline" data-route="pipeline"><i data-icon="refresh"></i>Pipeline<span class="nav-dot" id="badge-pipeline" hidden></span></a>
        <a href="#/agent" data-route="agent"><i data-icon="spark"></i>Agent</a>
        <a href="#/settings" data-route="settings"><i data-icon="settings"></i>Settings</a>
      </nav>
      <div class="sidebar-foot"><div id="integrations" class="integrations"></div><div class="theme-switch" id="theme-switch" role="group" aria-label="Theme"></div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">Overview</h1>
          <p id="page-sub" class="muted"></p>
        </div>
        <div class="topbar-actions" id="page-actions"></div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="modal-backdrop" id="modal-backdrop" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/app.js?v=1.2.1"></script>
</body>
</html>
