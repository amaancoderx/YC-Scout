# Render Blueprint: New > Blueprint > pick this repo. Secrets marked sync: false
# are asked for once in the Render dashboard (they are never stored in git).
services:
  - type: web
    name: yc-scout
    runtime: python
    plan: free
    region: singapore  # closest Render region to India; keep Turso in Singapore too
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ycscout.web.app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Login
      - key: APP_EMAIL
        value: amaan.coderx@gmail.com
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Cloud database (Turso). Render Free has no persistent disk.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-2.5-flash,gemini-flash-lite-latest,gemini-3.1-flash-lite
      - key: GEMINI_RESEARCH_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_RPM
        value: "10"
      # Email: sending goes through the Gmail API (Render Free blocks SMTP ports);
      # SMTP_USER / SMTP_PASSWORD are still used for reply tracking over IMAP (port 993).
      - key: FROM_EMAIL
        value: amaan.coderx@gmail.com
      - key: FROM_NAME
        value: Amaan Khan
      - key: SMTP_USER
        value: amaan.coderx@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      # Google Sheets (optional): paste the whole service-account JSON as one value
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
